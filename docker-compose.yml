services:
  proxy-colectivos:
    container_name: proxy-colectivos
    restart: always
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        - CLIENT_ID
        - CLIENT_SECRET
    env_file:
      - ./server/.env
    ports:
      - 8080:8080
      - 8081:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend-colectivos:
    container_name: frontend-colectivos
    build:
      context: ./cyan-cycle/
      dockerfile: dockerfile
    ports:
      - 4321:3000
    depends_on:
      - proxy-colectivos
